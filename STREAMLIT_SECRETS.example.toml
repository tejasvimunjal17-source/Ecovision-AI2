# Copy these values into Streamlit Community Cloud → Settings → Secrets.
# Never commit real credentials.

OPENROUTER_API_KEY = "your-openrouter-key"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
OPENROUTER_CHAT_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
OPENROUTER_VISION_MODEL = "openrouter/free"
OPENROUTER_SITE_URL = "https://YOUR-APP.streamlit.app"
OPENROUTER_APP_NAME = "EcoVision AI"

SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_SERVICE_ROLE_KEY = "YOUR_SERVICE_ROLE_KEY"
SUPABASE_STORAGE_BUCKET = "ecovision-media"

ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "replace-with-a-strong-password"
ADMIN_FIRST_NAME = "EcoVision"
ADMIN_LAST_NAME = "Administrator"

[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "YOUR_GOOGLE_OIDC_CLIENT_ID"
client_secret = "YOUR_GOOGLE_OIDC_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
